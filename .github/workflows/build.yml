name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Package release name (for example 0.71)"
        required: true
        type: string
      ref:
        description: "Upstream Yosys git ref (tag, branch, SHA). Defaults to v<tag>."
        required: false
        type: string
        default: ""
      latest:
        description: "Mark this release as the repository latest"
        required: false
        type: boolean
        default: true
      targets:
        description: "Ubuntu images to build"
        required: false
        type: choice
        default: all
        options:
          - all
          - 24.04
          - 26.04

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            ubuntu: "24.04"
          - runs-on: ubuntu-26.04
            ubuntu: "26.04"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    if: inputs.targets == 'all' || inputs.targets == matrix.ubuntu
    steps:
      - name: Resolve upstream ref
        id: meta
        run: |
          set -euo pipefail
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="v${{ inputs.tag }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream Yosys
        uses: actions/checkout@v4
        with:
          repository: YosysHQ/yosys
          ref: ${{ steps.meta.outputs.ref }}
          submodules: true
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison clang cmake flex gawk git lld make pkg-config python3 \
            libffi-dev libfl-dev libreadline-dev tcl-dev zlib1g-dev

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake -B build . \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOSYS_USE_BUNDLED_LIBS=ON \
            -DYOSYS_ENABLE_HOMEBREW=OFF
          cmake --build build -j"$(nproc)"

      - name: Install prefix
        run: cmake --install build --prefix dist

      - name: Check version
        env:
          YOSYS_DATDIR: ${{ github.workspace }}/dist/share/yosys
        run: |
          set -euo pipefail
          dist/bin/yosys -V | tee version-${{ matrix.ubuntu }}.txt
          dist/bin/yosys-config --datdir

      - name: Package
        run: |
          set -euo pipefail
          asset="yosys-ubuntu-${{ matrix.ubuntu }}.tar.gz"
          tar -C dist -czf "$asset" .
          tar -tzf "$asset" | head -20

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: yosys-ubuntu-${{ matrix.ubuntu }}.tar.gz
          path: yosys-ubuntu-${{ matrix.ubuntu }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
    steps:
      - name: Resolve upstream ref
        id: meta
        run: |
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="v${{ inputs.tag }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Download assets
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: yosys-ubuntu-*
          merge-multiple: true

      - name: Verify at least one tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(yosys-ubuntu-*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No yosys-ubuntu-*.tar.gz artifacts were produced" >&2
            exit 1
          fi
          ls -la "${files[@]}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          make_latest: ${{ inputs.latest }}
          files: yosys-ubuntu-*.tar.gz
          fail_on_unmatched_files: false
          body: |
            Prebuilt Yosys ${{ inputs.tag }} for GitHub-hosted Ubuntu runners.

            | Asset | Runner |
            |-------|--------|
            | `yosys-ubuntu-26.04.tar.gz` | `ubuntu-26.04` / `ubuntu-latest` (while latest is 26.04) |
            | `yosys-ubuntu-24.04.tar.gz` | `ubuntu-24.04` |

            Source: https://github.com/YosysHQ/yosys/tree/${{ steps.meta.outputs.ref }}

            Archive layout: CMake prefix install (`bin/yosys`, `share/yosys`, …).
            [`daxzio/setup-yosys`](https://github.com/daxzio/setup-yosys) picks the asset for the runner automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}